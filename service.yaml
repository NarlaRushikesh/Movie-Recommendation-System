apiVersion: v1
kind: Service
metadata:
  name: movie-recommender-service
  labels:
    app: movie-recommender
spec:
  # 🔹 For Minikube or direct local testing, NodePort is fine.
  #    If you later move to cloud (GKE, EKS, etc.), switch to LoadBalancer or Ingress.
  type: NodePort

  selector:
    app: movie-recommender

  ports:
    - name: http
      port: 8501           # Service port (cluster internal)
      targetPort: 8501     # Container port in app
      nodePort: 30010      # External port accessible via minikube ip:30010
